name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Run GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests
        run: go test -v -race ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    # Only run for stable releases (ignore tags containing hyphens like v1.0.0-rc1)
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Checkout Tap Repository
        uses: actions/checkout@v4
        with:
          repository: sxijyoti/homebrew-whiskey
          token: ${{ secrets.GH_TOKEN }}
          path: tap

      - name: Generate Homebrew Formula
        run: |
          ./packaging/homebrew/update_formula.sh \
            "${{ github.ref_name }}" \
            "dist/whiskey_checksums.txt" \
            "packaging/homebrew/whiskey.rb.tmpl" \
            "tap/Formula/whiskey.rb"

      - name: Commit and Push to Tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet Formula/whiskey.rb; then
            echo "No changes to Homebrew Formula. Skipping commit and push."
          else
            git add Formula/whiskey.rb
            git commit -m "Update whiskey to ${{ github.ref_name }}"
            git push origin main
            echo "Homebrew Formula updated successfully."
          fi
